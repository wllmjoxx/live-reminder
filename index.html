<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#022a5e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Live Reminder SLAB</title>
  <link rel="manifest" href="manifest.json"/>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://accounts.google.com/gsi/client" async onload="onGsiLoad()"></script>
  <script src="https://cdn.jsdelivr.net/npm/obs-websocket-js@5.0.3/dist/obs-ws.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    /* ── SIRCLO-INSPIRED COLOR PALETTE & VARIABLES ── */
    :root {
      --sirclo-bg:           #022a5e;       /* Deep Corporate Blue */
      --sirclo-bg-light:     #053b7d;       
      
      --bs-primary:          #0ea5e9;       /* Bright Blue for buttons */
      --bs-primary-light:    #38bdf8;       
      --bs-primary-subtle:   #e0f2fe;       
      --bs-primary-text:     #0369a1;       
      
      --bs-secondary:        #64748b;       
      --bs-secondary-subtle: #f1f5f9;       
      
      --bs-success:          #10b981;       
      --bs-success-subtle:   #d1fae5;       
      --bs-success-text:     #065f46;       
      
      --bs-warning:          #f59e0b;       
      --bs-warning-subtle:   #fef3c7;       
      --bs-warning-text:     #92400e;       
      
      --bs-danger:           #ef4444;       
      --bs-danger-subtle:    #fee2e2;       
      --bs-danger-text:      #991b1b;       
      
      --bs-purple:           #8b5cf6;       
      
      --bs-light:            #f8fafc;       
      --bs-dark:             #0f172a;       
      --bs-body-color:       #1e293b;       
      --bs-muted:            #64748b;       
      --bs-border:           #e2e8f0;       
      --bs-border-subtle:    #f1f5f9;       
      --bs-white:            #ffffff;
      
      --bs-radius:           0.5rem;
      --bs-radius-lg:        1rem;
      --bs-radius-xl:        1.5rem;
      --bs-radius-pill:      50rem;
      
      --bs-shadow-sm:        0 2px 4px 0 rgba(0, 0, 0, 0.05);
      --bs-shadow:           0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --bs-shadow-lg:        0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.875rem;
      line-height: 1.5;
      background-color: var(--sirclo-bg);
      color: white;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* ── CONCENTRIC CIRCLES BACKGROUND ── */
    .bg-circles {
      position: fixed;
      top: 50%; left: 30%;
      transform: translate(-50%, -50%);
      width: 100vw; height: 100vw;
      border-radius: 50%;
      box-shadow: 
        0 0 0 100px rgba(255, 255, 255, 0.02),
        0 0 0 250px rgba(255, 255, 255, 0.02),
        0 0 0 450px rgba(255, 255, 255, 0.02),
        0 0 0 700px rgba(255, 255, 255, 0.02);
      z-index: -1;
      pointer-events: none;
    }

    /* ── FLOATING NAVBAR (Pill Style) ── */
    .navbar-wrapper {
      position: fixed;
      top: 20px; left: 0; right: 0;
      display: flex; justify-content: center;
      z-index: 1000;
      padding: 0 20px;
    }
    .navbar {
      background: var(--bs-white);
      color: var(--bs-dark);
      width: 100%; max-width: 1200px;
      border-radius: 50px;
      padding: 12px 30px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    .navbar-brand {
      font-size: 1.2rem; font-weight: 800;
      display: flex; align-items: center; gap: 10px;
      letter-spacing: -0.5px; color: var(--bs-primary);
    }
    .navbar-brand span.logo-icon {
      background: var(--bs-primary-subtle);
      padding: 6px 10px; border-radius: 50px; font-size: 1rem;
    }
    .navbar-right {
      display: flex; align-items: center; gap: 20px;
    }
    .navbar-clock { text-align: right; line-height: 1.2; }
    #clock { font-size: 1.2rem; font-weight: 800; color: var(--bs-dark); }
    #date-display { font-size: 0.65rem; color: var(--bs-muted); font-weight: 600; text-transform: uppercase; }
    #notif-count  { font-size: 0.65rem; color: var(--bs-primary); font-weight: 700; }
    
    #user-login-wrapper { display:none; align-items:center; gap:10px; }

    /* ── HERO SECTION ── */
    .hero {
      padding: 140px 20px 40px;
      text-align: center;
      max-width: 1000px;
      margin: 0 auto;
    }
    .hero h1 {
      font-size: clamp(3rem, 6vw, 5rem);
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin-bottom: 20px;
    }
    .hero p {
      font-size: clamp(1rem, 2vw, 1.25rem);
      opacity: 0.8;
      font-weight: 500;
    }

    /* ── STATS CARDS (Like Client Logos) ── */
    .stats-row {
      display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;
      margin-top: 50px; padding: 0 20px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      color: var(--bs-dark);
      border-radius: var(--bs-radius-xl);
      padding: 20px 30px;
      text-align: center;
      min-width: 160px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }
    .stat-card:hover { transform: translateY(-5px); }
    .stat-num   { font-size: 2rem; font-weight: 800; line-height: 1; }
    .stat-label { font-size: 0.75rem; color: var(--bs-muted); margin-top: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

    /* ── TABS (Nav Pills) ── */
    .nav-tabs-wrapper {
      display: flex; justify-content: center;
      margin: 50px auto 30px;
      padding: 0 20px;
    }
    .nav-pills {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px;
      border-radius: 50px;
      backdrop-filter: blur(10px);
    }
    .nav-pills .nav-link {
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      color: white;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .nav-pills .nav-link:hover { background: rgba(255,255,255,0.15); }
    .nav-pills .nav-link.active {
      background: var(--bs-white);
      color: var(--sirclo-bg);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* ── ACTION BAR (Refresh Button) ── */
    .action-bar {
      text-align: center;
      margin-bottom: 30px;
    }
    .action-bar .btn {
      background: rgba(255,255,255,0.15);
      color: white; border: 1px solid rgba(255,255,255,0.3);
      padding: 10px 24px; border-radius: 50px;
      font-weight: 600; font-size: 0.85rem; cursor: pointer;
      transition: 0.3s;
    }
    .action-bar .btn:hover { background: white; color: var(--sirclo-bg); }

    /* ── MAIN CONTENT AREA ── */
    #main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    /* Ensure text inside schedule-list is readable against generated white cards */
    #schedule-list {
      color: var(--bs-body-color);
    }

    /* ── BANNER / ALERTS (Toasts) ── */
    .alert {
      display: none; 
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      padding: 12px 24px; border-radius: 50px;
      font-size: 0.85rem; font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 9999; text-align: center;
    }
    .alert.alert-success { display:block; background: var(--bs-success); color: white; }
    .alert.alert-danger  { display:block; background: var(--bs-danger);  color: white; }
    .alert.alert-warning { display:block; background: var(--bs-warning); color: white; }
    .alert.alert-info    { display:block; background: var(--bs-primary); color: white; }

    /* ── GENERATED APP CARDS CSS (Preserved & Adjusted for aesthetics) ── */
    .card, .marathon-session-card, .session-card, .bt-shift, .brand-standby-block, .shift-block {
      background: var(--bs-white);
      border: none;
      border-radius: var(--bs-radius-xl);
      margin-bottom: 16px;
      box-shadow: var(--bs-shadow);
      overflow: hidden;
      transition: transform 0.2s ease;
    }
    .card-header, .ms-card-header, .bt-shift-header, .brand-standby-header {
      padding: 16px 20px;
      background: var(--bs-light);
      border-bottom: 1px solid var(--bs-border-subtle);
      font-size: 0.85rem; font-weight: 800; color: var(--bs-dark);
    }
    .ms-card-header { background: var(--bs-primary-subtle); border-color: #bae6fd; }
    .ms-brand { font-size: 1.1rem; color: var(--bs-primary-text); }
    
    .host-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: var(--bs-radius-lg);
      border: 1px solid var(--bs-border);
      background: var(--bs-white);
      margin-bottom: 8px;
    }
    .host-current { background: #f0fdf4; border-color: #bbf7d0; border-left: 5px solid var(--bs-success); }
    .host-next    { background: #f0f9ff; border-color: #bae6fd; border-left: 5px solid var(--bs-primary); }
    
    .session-card { border-left: 5px solid var(--bs-primary); }
    .session-card.soon { border-left-color: var(--bs-warning); }
    
    .time-header {
      background: rgba(255,255,255,0.9);
      color: var(--bs-dark);
      padding: 12px 20px; border-radius: var(--bs-radius-lg);
      font-weight: 800; margin-bottom: 10px; cursor: pointer;
    }
    
    .badge {
      font-size: 0.65rem; padding: 4px 10px;
      border-radius: 50px; font-weight: 700;
    }
    .badge.marketplace { background: var(--bs-primary-subtle); color: var(--bs-primary-text); }
    .badge.studio      { background: var(--bs-success-subtle); color: var(--bs-success-text); }
    
    /* Loading */
    #loading { display: none; text-align: center; padding: 50px; color: white; }
    .spinner-border {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 0 auto 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .empty { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.7); font-size: 1rem; }
    .empty .empty-icon { font-size: 4rem; display: block; margin-bottom: 15px; }

    /* Fix MCR Modal / Input to match theme */
    #mcr-pin-input { border-radius: 50px; padding: 15px; border: 2px solid var(--bs-border); }
    
    #notif-panel {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: white; color: var(--bs-dark);
      padding: 20px; border-radius: 20px 20px 0 0;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
      z-index: 2000;
    }

  </style>
</head>
<body>

  <!-- Background Pattern -->
  <div class="bg-circles"></div>

  <!-- FLOATING NAVBAR -->
  <div class="navbar-wrapper">
    <nav class="navbar">
      <div class="navbar-brand">
        <span class="logo-icon">✨</span>
        SLAB Reminder
      </div>
      
      <div class="navbar-right">
        <div id="user-login-wrapper">
          <span style="font-size:0.75rem; font-weight:600;">Sign in to sync:</span>
          <div id="google-signin-btn"></div>
        </div>
        
        <div class="navbar-clock">
          <div id="clock">--:--:--</div>
          <div id="date-display">Memuat...</div>
          <div id="notif-count"></div>
        </div>
        <div id="online-users" style="font-size: 0.75rem; font-weight: 700; color: var(--bs-primary);">👤 ...</div>
      </div>
    </nav>
  </div>

  <!-- FLOATING ALERTS (Toasts) -->
  <div id="banner" class="alert"></div>

  <!-- HERO SECTION -->
  <section class="hero">
    <h1>Be the Future, Today</h1>
    <p>Leading Omnichannel Live Stream Management Enabler in Indonesia</p>
  </section>

  <!-- STATS CARDS (Resembling Logo Grid) -->
  <div class="stats-row">
    <div class="stat-card total">
      <div class="stat-num" id="stat-total">-</div>
      <div class="stat-label">Total Jadwal</div>
    </div>
    <div class="stat-card marathon">
      <div class="stat-num" id="stat-marathon" style="color: var(--bs-warning);">-</div>
      <div class="stat-label">Marathon</div>
    </div>
    <div class="stat-card single">
      <div class="stat-num" id="stat-single" style="color: var(--bs-success);">-</div>
      <div class="stat-label">Single Host</div>
    </div>
  </div>

  <!-- TABS (Nav Pills) -->
  <div class="nav-tabs-wrapper">
    <div class="nav-pills">
      <button id="tab-marathon"    class="nav-link active" onclick="switchTab('marathon')">Marathon</button>
      <button id="tab-single"      class="nav-link"        onclick="switchTab('single')">Single</button>
      <button id="tab-timeline"    class="nav-link"        onclick="switchTab('timeline')">Timeline</button>
      <button id="tab-standby"     class="nav-link"        onclick="switchTab('standby')">Standby</button>
      <button id="tab-klasemen"    class="nav-link"        onclick="switchTab('klasemen')">Klasemen</button>
      <button id="tab-hariH"       class="nav-link"        onclick="switchTab('hariH')">Hari H</button>
      <button id="tab-buktiTayang" class="nav-link"        onclick="switchTab('buktiTayang')">Bukti Tayang</button>
      <button id="tab-mcr"         class="nav-link"        onclick="switchTab('mcr')">MCR Monitor</button>
    </div>
  </div>

  <!-- ACTION BAR -->
  <div class="action-bar">
    <button class="btn" onclick="loadSchedule(true)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: -3px; margin-right: 4px;"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
      Refresh Jadwal
    </button>
  </div>

  <!-- MAIN DYNAMIC CONTENT -->
  <main id="main-content">
    <div id="loading">
      <div class="spinner-border"></div>
      <span style="font-size:0.9rem; font-weight:700; letter-spacing:1px;">SINKRONISASI DATA...</span>
    </div>
    
    <!-- Area dimana JS merender konten -->
    <div id="schedule-list"></div>
  </main>

  <!-- NOTIF PANEL -->
  <div id="notif-panel" style="display:none;">
    <div style="font-size: 0.85rem; font-weight: 800; color: var(--bs-muted); text-transform: uppercase; margin-bottom: 12px;">Kirim Notifikasi Ke Jam Spesifik</div>
    <div id="notif-time-list" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 20px;"></div>
    <button class="btn" onclick="document.getElementById('notif-panel').style.display='none'" style="background: var(--bs-border); color: var(--bs-dark); padding: 8px 20px; border-radius: 50px; font-weight: 700; border: none; cursor: pointer;">Tutup Panel</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
